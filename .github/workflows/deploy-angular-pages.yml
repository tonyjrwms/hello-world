name: Deploy Paycheck Budget Planner (Angular) to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/paycheck-budget-app-961dt6
    paths:
      - "paycheck-budget-angular/**"
      - ".github/workflows/deploy-angular-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paycheck-budget-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: paycheck-budget-angular/package-lock.json

      - run: npm ci

      # GitHub Pages serves this repo at /hello-world/, so the app needs to
      # know its own base path for routing and asset URLs to resolve.
      - run: npx ng build --base-href /hello-world/

      - name: Prepare Pages output
        run: |
          cd dist/paycheck-budget-angular/browser
          # Tells GitHub Pages not to run this through Jekyll.
          touch .nojekyll
          # SPA fallback: GitHub Pages has no server-side routing, so a
          # direct visit to e.g. /hello-world/history 404s. Serving the
          # same index.html for 404s lets Angular's router take over and
          # resolve the route client-side.
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: paycheck-budget-angular/dist/paycheck-budget-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

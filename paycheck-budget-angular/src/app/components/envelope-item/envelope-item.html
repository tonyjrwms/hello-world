<button
  class="envelope-head"
  type="button"
  [attr.aria-expanded]="expanded()"
  (click)="toggle.emit()"
>
  <span
    class="env-badge"
    [class.state-warning]="status() === 'warning'"
    [class.state-critical]="status() === 'critical'"
  >
    {{ envelope().name.charAt(0).toUpperCase() }}
  </span>

  <span class="env-main">
    <span class="env-name-row">
      <span class="env-name">{{ envelope().name }}</span>
      <span class="env-remaining num" [class.critical]="remaining() < 0">
        <span [hidden]="remaining() >= 0">&minus;</span>{{ (remaining() < 0 ? -remaining() : remaining()) | currency }}
      </span>
    </span>
    <span class="env-sub-row">
      <span class="env-sub num">{{ envelope().spent | currency }} of {{ envelope().allocated | currency }}</span>
      <span class="env-sub">{{ envelope().rollover ? 'rolls over' : 'resets each check' }}</span>
    </span>
    <span class="env-bar-track">
      <span
        class="env-bar-fill"
        [class.state-warning]="status() === 'warning'"
        [class.state-critical]="status() === 'critical'"
        [style.width.%]="percentSpent()"
      ></span>
    </span>
  </span>

  <svg
    class="chev"
    [class.flipped]="expanded()"
    width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>

@if (expanded()) {
  <div class="env-detail">
    <form
      class="quick-add"
      #quickAddForm
      (submit)="$event.preventDefault(); onAddExpense(amountInput.value, noteInput.value, quickAddForm)"
    >
      <input #amountInput type="number" name="amount" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required />
      <input #noteInput type="text" name="note" placeholder="What was it for?" maxlength="40" />
      <button type="submit" class="btn-add">Add</button>
    </form>

    @if (envelope().transactions.length === 0) {
      <p class="tx-empty">No spending logged this period.</p>
    } @else {
      <div class="tx-list">
        @for (tx of recentFirst(); track tx.id) {
          <div class="tx-row">
            <span class="tx-note">{{ tx.note }}</span>
            <span class="tx-amount num">{{ tx.amount | currency }}</span>
            <button class="tx-del" type="button" (click)="deleteTransaction.emit(tx.id)" aria-label="Delete expense">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        }
      </div>
    }

    <div class="env-manage">
      <button type="button" class="text-btn" (click)="edit.emit()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        Edit
      </button>
      <button type="button" class="text-btn danger" (click)="remove.emit()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        </svg>
        Delete
      </button>
    </div>
  </div>
}
